<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How an explainer is made</title>
<link rel="stylesheet" href="player.css">
<script defer src="player.js"></script>
<!-- The explainer on a page of its own, in the colours of lib/scene.css. Used
     as is when a site gives the explainer its own look, and as a preview. -->
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 32px 16px 64px;
    background: #f5f0e8; color: #1a1715;
    font: 17px/1.55 "Inter", system-ui, sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 1.9em; line-height: 1.2; margin: 0 0 0.6em; }
  .explainer { --explainer-accent: #3a6ea5; --explainer-mark: rgba(58, 110, 165, 0.16); }
  .explainer-transcript { max-width: 70ch; margin-top: 2em; }
  .explainer-chapter-title { font-size: 1.05em; margin: 1.6em 0 0.4em; }
  .explainer-chapter-title a { color: inherit; text-decoration: none; }
  .explainer-chapter-title a:hover { color: #3a6ea5; }
  .explainer-chapter.is-current .explainer-chapter-title a { color: #3a6ea5; }
  .explainer-chapter p { margin: 0; }
  @media (prefers-color-scheme: dark) {
    body { background: #16181d; color: #eceef2; }
    .explainer { --explainer-accent: #6aa8e0; --explainer-mark: rgba(106, 168, 224, 0.2); }
    .explainer-chapter-title a:hover,
    .explainer-chapter.is-current .explainer-chapter-title a { color: #6aa8e0; }
  }
</style>
</head>
<body>
<main>
  <h1>How an explainer is made</h1>
  <div class="explainer" data-manifest="manifest.json"></div>
</main>
</body>
</html>
