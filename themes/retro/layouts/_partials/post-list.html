<ul class="posts-list">
  {{- range . }}
    <li class="posts-list-item">
      <a class="posts-list-item-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
      <span class="posts-list-item-description">
        {{ .PublishDate.Format "Jan 2, 2006" }}
        <span class="sep">&middot;</span>
        {{ .ReadingTime }} min read
      </span>
    </li>
  {{- end }}
</ul>
